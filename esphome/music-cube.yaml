# =====================================================================
#  Музыкальный куб — прошивка ESPHome
#  Основа: adonno/tagreader (https://github.com/adonno/tagreader) + звук.
#
#  Плата: ESP32-S3 DevKitC-1 N16R8 (16 МБ flash, 8 МБ PSRAM)
#         D1 mini (ESP8266) звук в ESPHome играть не умеет — поэтому ESP32.
#  NFC:   PN532 по I2C (переключатели на модуле: I2C), питание 3.3 В
#  Звук:  MAX98357A (I2S-усилитель) или PCM5102A (I2S-ЦАП) -> ваш усилитель
#  LED:   WS2812 — один светодиод или кольцо вокруг диска
#
#  Что осталось из tagreader:
#   - tag_scanned в HA (метки HA через NDEF или по UID)
#   - события esphome.music_tag (ссылки Music Assistant на метке) и esphome.tag_removed
#   - запись меток из HA: кнопки Write Tag Random / Clean Tag / Cancel и сервис write_tag_id
#   - индикация светодиодом
#  Что убрано: зуммер (теперь есть динамики).
#
#  Новое: датчик "Current Disc" — на него реагирует автоматизация HA:
#   положили диск -> ID диска, сняли -> "none".
# =====================================================================

substitutions:
  name: music-cube
  friendly_name: Music Cube   # entity_id: sensor.music_cube_current_disc,
                              # media_player.music_cube_player
  # Пины. Не используйте GPIO0, 3, 45, 46 (strapping), GPIO19/20 (USB),
  # GPIO35-37 (заняты PSRAM на N16R8).
  i2c_sda: GPIO8
  i2c_scl: GPIO9
  i2s_lrclk: GPIO5
  i2s_bclk: GPIO6
  i2s_dout: GPIO7
  led_pin: GPIO4
  led_count: "10"             # адресные светодиоды WS2812
  btn_vol_up: GPIO15
  btn_vol_down: GPIO16
  btn_play: GPIO17

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -10
    then:
      - wait_until:
          api.connected:
      - light.turn_on:
          id: activity_led
          brightness: 60%
          red: 0%
          green: 0%
          blue: 100%
          flash_length: 500ms

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf   # speaker media_player работает только на esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

# Ключи вынесены в secrets.yaml (в старом конфиге они были прямо в файле)
api:
  encryption:
    key: !secret music_cube_api_key
  actions:
    # Записать на диск метку HA с заданным ID (из tagreader)
    - action: write_tag_id
      variables:
        tag_id: string
      then:
        - light.turn_on: { id: activity_led, brightness: 100%, red: 100%, green: 0%, blue: 0% }
        - lambda: |-
            auto message = new nfc::NdefMessage();
            std::string uri = "https://www.home-assistant.io/tag/";
            uri += tag_id;
            message->add_uri_record(uri);
            id(pn532_board).write_mode(message);
        - wait_until:
            not:
              pn532.is_writing:
        - light.turn_off: activity_led

ota:
  - platform: esphome
    password: !secret music_cube_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Music Cube Fallback"

captive_portal:

improv_serial:

globals:
  - id: source
    type: std::string
  - id: url
    type: std::string
  - id: info
    type: std::string

# ---------------------------------------------------------------------
#  NFC: PN532 (I2C)
# ---------------------------------------------------------------------
i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: false
  frequency: 400kHz

pn532_i2c:
  id: pn532_board
  update_interval: 500ms
  on_tag:
    then:
      - if:
          condition:
            switch.is_on: led_enabled
          then:
            - light.turn_on:
                id: activity_led
                brightness: 100%
                red: 0%
                green: 100%
                blue: 0%
                flash_length: 500ms
      - delay: 0.15s   # из tagreader: PN532 не всегда успевает дочитать NDEF
      # Разбор NDEF — упрощённая версия из tagreader:
      #  hass -> метка HA (ID из ссылки), mass -> ссылка Music Assistant, иначе UID
      - lambda: |-
          id(source) = "uid";
          id(url) = "";
          id(info) = "";
          if (tag.has_ndef_message()) {
            for (auto &record : tag.get_ndef_message()->get_records()) {
              std::string payload = record->get_payload();
              std::string type = record->get_type();
              size_t hass = payload.find("https://www.home-assistant.io/tag/");
              if (type == "U" && hass != std::string::npos) {
                id(source) = "hass";
                id(url) = payload;
                id(info) = payload.substr(hass + 34);
              } else if (type == "U" && payload.find("://") != std::string::npos
                         && id(source) != "hass") {
                // filesystem_local://, spotify://, ytmusic:// ... (Music Assistant)
                id(source) = "mass";
                id(url) = payload;
              } else if (type == "T") {
                id(info) = payload;
              }
            }
          }
      # ID диска: ID метки HA, если записан, иначе UID
      - text_sensor.template.publish:
          id: current_disc
          state: !lambda 'return id(source) == "hass" ? id(info) : x;'
      - homeassistant.tag_scanned: !lambda 'return id(source) == "hass" ? id(info) : x;'
      # Совместимость с блюпринтами tagreader для Music Assistant
      - if:
          condition:
            lambda: 'return id(source) == "mass";'
          then:
            - homeassistant.event:
                event: esphome.music_tag
                data:
                  reader: !lambda 'return App.get_name().c_str();'
                  source: !lambda 'return id(source);'
                  url: !lambda 'return id(url);'
                  info: !lambda 'return id(info);'
  on_tag_removed:
    then:
      - text_sensor.template.publish:
          id: current_disc
          state: "none"
      - homeassistant.event:
          event: esphome.tag_removed

text_sensor:
  - platform: template
    id: current_disc
    name: "Current Disc"
    icon: mdi:album

# ---------------------------------------------------------------------
#  Звук: I2S -> MAX98357A (или PCM5102A)
# ---------------------------------------------------------------------
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${i2s_lrclk}
    i2s_bclk_pin: ${i2s_bclk}

speaker:
  - platform: i2s_audio
    id: hw_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: ${i2s_dout}
    sample_rate: 48000
    bits_per_sample: 16bit
    # MAX98357A по умолчанию играет моно (L+R)/2 — то, что нужно.

  # Микшер: у плеера два канала — музыка и объявления (TTS)
  - platform: mixer
    id: mixer_speaker
    output_speaker: hw_speaker
    source_speakers:
      - id: announcement_input
      - id: media_input

media_player:
  - platform: speaker
    id: cube_player
    name: "Player"
    # Детский ограничитель громкости
    volume_min: 20%
    volume_max: 70%
    volume_initial: 40%
    volume_increment: 5%
    media_pipeline:
      speaker: media_input
      format: FLAC        # HA сам перекодирует mp3 в FLAC 48 кГц
      sample_rate: 48000
      num_channels: 1
    announcement_pipeline:
      speaker: announcement_input
      format: FLAC
      sample_rate: 48000
      num_channels: 1

# ---------------------------------------------------------------------
#  Светодиод / кольцо WS2812
# ---------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip   # neopixelbus на esp-idf не работает
    id: activity_led
    name: "LED"
    pin: ${led_pin}
    num_leds: ${led_count}
    chipset: ws2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    # Ограничение яркости: 10 диодов на полном белом берут ~0.6 А, а детям столько не нужно
    color_correct: [50%, 50%, 50%]
    default_transition_length: 400ms
    effects:
      - pulse:                     # «дышит» цветом пластинки, пока играет
          name: "Breathe"
          transition_length: 1.2s
          update_interval: 1.2s
          min_brightness: 25%
          max_brightness: 100%
      - addressable_rainbow:
          name: "Rainbow"
      - addressable_twinkle:       # «нотки» как у джукбокса в Minecraft
          name: "Notes"
          twinkle_probability: 8%
      - addressable_scan:
          name: "Scan"

# ---------------------------------------------------------------------
#  Переключатели и кнопки HA (из tagreader)
# ---------------------------------------------------------------------
switch:
  - platform: template
    name: "LED enabled"
    id: led_enabled
    icon: mdi:alarm-light-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

button:
  - platform: template
    name: Write Tag Random
    icon: "mdi:pencil-box"
    on_press:
      - light.turn_on: { id: activity_led, brightness: 100%, red: 100%, green: 0%, blue: 100% }
      - lambda: |-
          static const char alphanum[] = "0123456789abcdef";
          std::string uri = "https://www.home-assistant.io/tag/";
          for (int i = 0; i < 8; i++) uri += alphanum[random_uint32() % 16];
          uri += "-";
          for (int j = 0; j < 3; j++) {
            for (int i = 0; i < 4; i++) uri += alphanum[random_uint32() % 16];
            uri += "-";
          }
          for (int i = 0; i < 12; i++) uri += alphanum[random_uint32() % 16];
          auto message = new nfc::NdefMessage();
          message->add_uri_record(uri);
          id(pn532_board).write_mode(message);
      - wait_until:
          not:
            pn532.is_writing:
      - light.turn_off: activity_led
  - platform: template
    name: Clean Tag
    icon: "mdi:nfc-variant-off"
    on_press:
      - light.turn_on: { id: activity_led, brightness: 100%, red: 100%, green: 65%, blue: 0% }
      - lambda: 'id(pn532_board).clean_mode();'
      - wait_until:
          not:
            pn532.is_writing:
      - light.turn_off: activity_led
  - platform: template
    name: Cancel writing
    icon: "mdi:pencil-off"
    on_press:
      - lambda: 'id(pn532_board).read_mode();'
      - light.turn_off: activity_led
  - platform: restart
    name: "Restart"
    entity_category: config

# ---------------------------------------------------------------------
#  Физические кнопки на кубе (тактовые 12x12, на GND)
# ---------------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

  - platform: gpio
    name: "Button Volume Up"
    pin: { number: "${btn_vol_up}", mode: INPUT_PULLUP, inverted: true }
    filters: [delayed_on: 30ms]
    on_press:
      - media_player.volume_up: cube_player

  - platform: gpio
    name: "Button Volume Down"
    pin: { number: "${btn_vol_down}", mode: INPUT_PULLUP, inverted: true }
    filters: [delayed_on: 30ms]
    on_press:
      - media_player.volume_down: cube_player

  - platform: gpio
    name: "Button Play Pause"
    pin: { number: "${btn_play}", mode: INPUT_PULLUP, inverted: true }
    filters: [delayed_on: 30ms]
    on_press:
      - media_player.toggle: cube_player
